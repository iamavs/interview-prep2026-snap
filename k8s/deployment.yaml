apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        image: anoopsuvarna/snap:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
